name: Deploy web app (GitHub Pages)

# main에 푸시하면 app/ 폴더를 gh-pages 브랜치로 배포 → https://zzangii1020.github.io/some-torial/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump service worker cache version
        run: sed -i "s/sometorial-v1/sometorial-${{ github.run_number }}/" app/sw.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app
          publish_branch: gh-pages
          force_orphan: true
