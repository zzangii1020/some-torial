name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Set app icon
        run: |
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$d"
            cp app/icons/icon-192.png "$RES/mipmap-$d/ic_launcher.png"
            cp app/icons/icon-192.png "$RES/mipmap-$d/ic_launcher_round.png"
            cp app/icons/icon-192.png "$RES/mipmap-$d/ic_launcher_foreground.png"
          done

      - name: Fixed signing key + version
        run: |
          # 매 빌드 같은 서명 키 사용 → 기존 앱 위에 덮어쓰기 설치 가능 (저장 데이터 유지)
          mkdir -p ~/.android
          cp keys/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk sometorial.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sometorial-apk
          path: sometorial.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 썸토리얼 v1.0.${{ github.run_number }}
          body: |
            📱 **안드로이드:** 아래 `sometorial.apk`를 받아 설치하세요. (설정에서 "출처를 알 수 없는 앱 설치"를 허용해야 할 수 있어요)
            🍎 **iPhone / PC:** https://zzangii1020.github.io/some-torial/ 에 접속 → 홈 화면에 추가
          files: sometorial.apk
          make_latest: true
